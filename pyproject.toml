[project]
name = "diffposetalk"
version = "0.1.0"
description = "Diffusion-based speech-driven stylistic 3D facial animation and head pose generation"
readme = "README.md"
requires-python = "==3.8.*"
dependencies = [
    # ── Deep learning ──────────────────────────────────────────────────────────
    "torch==2.4.0",
    "triton==3.0.0",
    "transformers==4.44.0",
    "tokenizers==0.19.1",
    "huggingface-hub==0.24.5",
    "safetensors==0.4.4",

    # ── CUDA runtime (Linux, CUDA 12.1) ────────────────────────────────────────
    "nvidia-cublas-cu12==12.1.3.1",
    "nvidia-cuda-cupti-cu12==12.1.105",
    "nvidia-cuda-nvrtc-cu12==12.1.105",
    "nvidia-cuda-runtime-cu12==12.1.105",
    "nvidia-cudnn-cu12==9.1.0.70",
    "nvidia-cufft-cu12==11.0.2.54",
    "nvidia-curand-cu12==10.3.2.106",
    "nvidia-cusolver-cu12==11.4.5.107",
    "nvidia-cusparse-cu12==12.1.0.106",
    "nvidia-nccl-cu12==2.20.5",
    "nvidia-nvjitlink-cu12==12.6.20",
    "nvidia-nvtx-cu12==12.1.105",

    # ── Numerical / scientific ──────────────────────────────────────────────────
    "numpy==1.24.4",
    "scipy==1.10.1",
    "scikit-learn==1.3.2",
    "numba==0.58.1",
    "llvmlite==0.41.1",
    "sympy==1.13.1",
    "mpmath==1.3.0",
    "networkx==3.1",

    # ── 3D / geometry ────────────────────────────────────────────────────────────
    "trimesh==4.4.3",
    "pyrender==0.1.45",
    "pyglet==2.0.16",
    "chumpy==0.70",
    "mesh==1.0.0a1",  # MPI-IS body mesh (psbody.mesh); psbody-mesh is not on PyPI

    # ── Audio ─────────────────────────────────────────────────────────────────────
    "librosa==0.10.2.post1",
    "audioread==3.0.1",
    "soundfile==0.12.1",
    "soxr==0.3.7",

    # ── Vision ────────────────────────────────────────────────────────────────────
    "opencv-python==4.10.0.84",
    "opencv-contrib-python==4.10.0.84",
    "pillow==10.4.0",
    "imageio==2.34.2",

    # ── Visualisation ─────────────────────────────────────────────────────────────
    "matplotlib==3.7.5",
    "contourpy==1.1.1",
    "cycler==0.12.1",
    "fonttools==4.53.1",
    "kiwisolver==1.4.5",
    "pyparsing==3.1.2",
    "freetype-py==2.4.0",

    # ── Utilities ─────────────────────────────────────────────────────────────────
    "tqdm==4.66.5",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "urllib3==2.2.2",
    "certifi==2024.7.4",
    "idna==3.7",
    "charset-normalizer==3.3.2",
    "filelock==3.15.4",
    "fsspec==2024.6.1",
    "packaging==24.1",
    "platformdirs==4.2.2",
    "typing-extensions==4.12.2",
    "importlib-metadata==8.2.0",
    "importlib-resources==6.4.0",
    "zipp==3.19.2",
    "six==1.16.0",
    "decorator==5.1.1",
    "lazy-loader==0.4",
    "pooch==1.8.2",
    "joblib==1.4.2",
    "threadpoolctl==3.5.0",
    "regex==2024.7.24",
    "msgpack==1.0.8",
    "pyzmq==26.1.0",
    "pycparser==2.22",
    "cffi==1.17.0",
    "markupsafe==2.1.5",
    "jinja2==3.1.4",
    "python-dateutil==2.9.0.post0",
]

[tool.uv]
# This is a research project, not an installable package.
package = false

# chumpy 0.70 uses a legacy setup.py that calls `import pip` and `import
# setuptools` at build time but doesn't declare them as build-system
# requirements.  UV's build isolation would hide them; listing them here
# injects them into chumpy's isolated build environment automatically.
[tool.uv.extra-build-dependencies]
chumpy = ["pip", "setuptools"]
